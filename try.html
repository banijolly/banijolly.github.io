<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine 💖</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ffd6e8, #ffe6f2, #fff0f5);
        font-family: 'Comic Sans MS', cursive;
        overflow: hidden;
        cursor: url('https://cur.cursors-4u.net/symbols/sym-1/sym58.cur'), auto;
    }

    .card {
        text-align: center;
        background: white;
        padding: 40px;
        border-radius: 25px;
        box-shadow: 0 10px 30px rgba(255, 105, 180, 0.3);
        position: relative;
    }

    h1 {
        color: #ff4da6;
        font-size: 2.5em;
    }

    .buttons {
        margin-top: 20px;
        position: relative;
    }

    button {
        padding: 12px 25px;
        font-size: 18px;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        margin: 10px;
        transition: 0.3s;
    }

    #yesBtn {
        background-color: #ff66b2;
        color: white;
    }

    #yesBtn:hover {
        background-color: #ff3385;
    }

    #noBtn {
        background-color: #ccc;
        position: absolute;
    }

    #message {
        margin-top: 20px;
        font-size: 20px;
        color: #ff3399;
        display: none;
    }

    .hearts {
        position: absolute;
        font-size: 20px;
        animation: float 3s linear infinite;
        opacity: 0.6;
    }

    @keyframes float {
        0% { transform: translateY(0); }
        100% { transform: translateY(-100vh); }
    }
</style>
</head>

<body>

<div class="card">
    <h1>Will You Be My Valentine? 💖</h1>
    <div class="buttons">
        <button id="yesBtn">Yes 💘</button>
        <button id="noBtn">No 💔</button>
    </div>
    <div id="message">YAYYYY!!! 💍💖 You just made me the happiest person alive!!!</div>
</div>

<script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const message = document.getElementById("message");

    function moveButton() {
        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 50);
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
        noBtn.innerText = "Not allowed 😜";
    }

    noBtn.addEventListener("mouseover", moveButton);
    noBtn.addEventListener("click", moveButton);

    yesBtn.addEventListener("click", () => {
        message.style.display = "block";
        createHearts();
    });

    function createHearts() {
        for (let i = 0; i < 30; i++) {
            const heart = document.createElement("div");
            heart.classList.add("hearts");
            heart.innerText = "💖";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = (Math.random() * 20 + 10) + "px";
            heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 4000);
        }
    }
</script>

</body>
</html>
